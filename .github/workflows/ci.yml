name: Build

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-policy:
    name: Release number and branch history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify synchronized release and feature trace
        env:
          RELEASE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RELEASE_HEAD_BRANCH: ${{ github.head_ref }}
          RELEASE_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: npm run release:check

  web:
    name: Web smoke and regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: WebApp/package-lock.json
      - name: Install web dependencies
        run: npm --prefix WebApp ci
      - name: Lint web app
        run: npm --prefix WebApp run lint
      - name: Build production web app
        run: npm --prefix WebApp run build
      - name: Run smoke tests for startup, sign-in, storage, and protected APIs
        run: npm --prefix WebApp run test:smoke:built
      - name: Run regression tests for product behavior and security
        run: npm --prefix WebApp run test:regression:built

  macos:
    name: macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test shared Swift contracts
        run: swift test --package-path Packages/AsitraContracts
      - name: Build Asitra for Mac
        run: >-
          xcodebuild
          -project AppleMobileApp.xcodeproj
          -scheme AppleMobileApp
          -configuration Release
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Build local Mac Debug without a development certificate
        run: >-
          xcodebuild
          -project AppleMobileApp.xcodeproj
          -scheme AppleMobileApp
          -configuration Debug
          -destination 'platform=macOS'
          build

  ios:
    name: iOS Simulator
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build Asitra for iPhone and iPad Simulator
        run: >-
          xcodebuild
          -project AppleMobileApp.xcodeproj
          -scheme AppleMobileApp
          -configuration Release
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
