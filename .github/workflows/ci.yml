name: Build

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web contracts and integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: WebApp/package-lock.json
      - name: Install web dependencies
        run: npm --prefix WebApp ci
      - name: Lint web app
        run: npm --prefix WebApp run lint
      - name: Test production web build and shared AI contract
        run: npm --prefix WebApp test

  macos:
    name: macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test shared Swift contracts
        run: swift test --package-path Packages/AsitraContracts
      - name: Build Asitra for Mac
        run: >-
          xcodebuild
          -project AppleMobileApp.xcodeproj
          -scheme AppleMobileApp
          -configuration Release
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Build local Mac Debug without a development certificate
        run: >-
          xcodebuild
          -project AppleMobileApp.xcodeproj
          -scheme AppleMobileApp
          -configuration Debug
          -destination 'platform=macOS'
          build

  ios:
    name: iOS Simulator
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build Asitra for iPhone and iPad Simulator
        run: >-
          xcodebuild
          -project AppleMobileApp.xcodeproj
          -scheme AppleMobileApp
          -configuration Release
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
