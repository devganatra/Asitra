<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="index,follow" />
    <meta name="theme-color" content="#f5f2ea" />
    <meta name="description" content="Open Sakhya, your private everyday system." />
    <meta http-equiv="refresh" content="1; url=https://sakhya-everyday.deepanddev.chatgpt.site/" />
    <link rel="canonical" href="https://sakhya-everyday.deepanddev.chatgpt.site/" />
    <title>Sakhya — Your everyday system</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 24px; color: #253029; background: radial-gradient(circle at 50% 20%, #e4ece5, transparent 38%), #f5f2ea; }
      main { width: min(440px, 100%); padding: 40px; border: 1px solid rgba(67, 88, 73, 0.13); border-radius: 28px; background: rgba(255, 255, 255, 0.78); box-shadow: 0 28px 80px rgba(36, 49, 40, 0.12); text-align: center; }
      .mark { width: 58px; height: 58px; display: grid; place-items: center; margin: 0 auto 22px; border-radius: 19px; color: white; background: linear-gradient(145deg, #6f8f7b, #456350); font: 700 25px Georgia, serif; }
      h1 { margin: 0; font: 600 38px/1.08 Georgia, serif; letter-spacing: -0.035em; }
      p { margin: 14px auto 24px; color: #6b746d; line-height: 1.65; }
      a { display: inline-flex; min-height: 44px; align-items: center; justify-content: center; padding: 0 20px; border-radius: 13px; color: white; background: #557361; font-weight: 700; text-decoration: none; }
      small { display: block; margin-top: 18px; color: #8b938d; }
    </style>
    <script>
      (() => {
        const destination = new URL("https://sakhya-everyday.deepanddev.chatgpt.site/");
        destination.search = window.location.search;
        destination.hash = window.location.hash;
        window.setTimeout(() => window.location.replace(destination), 250);
      })();
    </script>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">S</div>
      <h1>Opening Sakhya</h1>
      <p>Your private everyday system is ready. You will be taken to the secure application.</p>
      <a href="https://sakhya-everyday.deepanddev.chatgpt.site/">Open Sakhya</a>
      <small>Powered by the official Sakhya web application</small>
    </main>
  </body>
</html>
